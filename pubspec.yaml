name: ecogestion
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0
  flutter_local_notifications: ^16.0.0+1  # Mise à jour mineure
  firebase_database: ^10.3.8  # Mise à jour compatible
  percent_indicator: ^4.2.3
  image_picker: ^1.0.7  # Mise à jour majeure
  stylish_bottom_bar: ^1.1.1
  firebase_core: ^2.24.2  # Mise à jour compatible
  cloud_firestore: ^4.14.0  # Mise à jour compatible
  firebase_auth: ^4.16.0  # Mise à jour compatible
  firebase_storage: ^11.6.0  # Mise à jour compatible
  firebase_messaging: ^14.7.9  # Mise à jour compatible
  provider: ^6.1.1  # Mise à jour compatible
  fl_chart: ^0.65.0
  shared_preferences: ^2.2.2  # Mise à jour compatible
  mqtt_client: ^10.0.0
  intl: ^0.18.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
     - assets/images/
  fonts:
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins/Poppins-Bold.ttf

